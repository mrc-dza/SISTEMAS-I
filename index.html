<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameHub - Tu sitio de juegos</title>

    <script>
  (function() {
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>

    <link rel="stylesheet" href="assets/css/style.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body data-page="inicio">
    <div id="header-placeholder"></div>

    <main>
      <h2><i class="fa-solid fa-star"></i> Actualizaciones Recientes</h2>
      <div class="grid-container" id="recent-grid"></div>

      <h2><i class="fa-solid fa-fire"></i> Juegos Más Populares</h2>
      <div class="grid-container" id="popular-grid"></div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="assets/js/app.js"></script>
    <script src="assets/js/dynamic-content.js"></script>
  </body>
</html>
